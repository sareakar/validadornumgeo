; ─────────────────────────────────────────────────────────────────────────────
; Validador Telefónico AR — Ejemplos de dialplan (extensions.conf / macro)
; FastAGI: agi://${TELVAL_HOST}:${TELVAL_PORT}/validate
;
; TELVAL_HOST / TELVAL_PORT se definen UNA VEZ en [globals] (extensions.conf
; o un archivo incluido, ej. globals_telval.conf) y no se tocan más por
; dialplan de cliente — así cambiar de entorno (prueba → producción, o si
; el validador central cambia de host) es una sola edición, no un grep por
; cada extensions.conf de cliente:
;
;   [globals]
;   TELVAL_HOST=telval.centraltelefonica.com.ar   ; instalación local: 127.0.0.1
;   TELVAL_PORT=4573
;
; Variables que devuelve:
;   TELVAL_VALID      1 = válido | 0 = inválido
;   TELVAL_GEO        AMBA | Interior
;   TELVAL_TIPO       mobile | landline | unknown
;   TELVAL_MODALIDAD  CPP | MPP | BASICA | (vacío si no está en ENACOM)
;   TELVAL_OPERADOR   Movistar | Claro | Personal | Telecom...
;   TELVAL_AREA       11 | 351 | 261 | ...
;   TELVAL_10DIG      1130032202
;   TELVAL_CON0       01130032202
;   TELVAL_CON015     0111530032202    (solo si CPP/MPP, vacío si fijo)
;   TELVAL_E164       +541130032202
;   TELVAL_E164MOV    +5491130032202   (solo si CPP/MPP)
;   TELVAL_CON9       91130032202      (solo si CPP/MPP)
;   TELVAL_SOURCE     enacom_db | hint | heuristica
;   TELVAL_ERROR      formato_invalido | numero_invalido | ...
; ─────────────────────────────────────────────────────────────────────────────

; ── Macro de validación (llamar antes de cualquier Dial) ──────────────────────
[macro-validar-numero]
; ARG1 = número a validar
; ARG2 = área para números de 7/6 dígitos (opcional; sin especificarla,
;        esos números salen inválidos — no hay default, un 7 dígitos
;        nunca puede ser AMBA así que no tendría sentido asumir 11)
exten => s,1,AGI(agi://${TELVAL_HOST}:${TELVAL_PORT}/validate,${ARG1},${ARG2})
 same => n,Return()

; ── Contexto de salida con validación automática ──────────────────────────────
[salida-validada]
; El número entra como ${EXTEN} o como variable ${NUMERO}
exten => _X.,1,NoOp(--- Validando ${EXTEN} ---)
 same => n,Macro(validar-numero,${EXTEN})

 ; Si es inválido → reproducir mensaje y colgar
 same => n,GotoIf($["${TELVAL_VALID}" != "1"]?invalido)

 ; Log de la resolución
 same => n,Verbose(1,TELVAL: ${EXTEN} → ${TELVAL_GEO} ${TELVAL_TIPO} [${TELVAL_MODALIDAD}] ${TELVAL_OPERADOR})

 ; Rutear según modalidad ENACOM
 same => n,GotoIf($["${TELVAL_MODALIDAD}" = "CPP"]?cpp)
 same => n,GotoIf($["${TELVAL_MODALIDAD}" = "MPP"]?cpp)

 ; Fijo → trunk fijo, formato 10 dígitos o con 0 según el carrier
 same => n,Set(NUMERO_SALIDA=${TELVAL_CON0})
 same => n,Dial(SIP/${NUMERO_SALIDA}@trunk_fijo,60,gH)
 same => n,Goto(colgar)

 ; CPP/MPP → trunk móvil, formato según carrier
 same => n(cpp),Set(NUMERO_SALIDA=${TELVAL_CON015})    ; Personal: usa 0+área+15+número
 ; same => n(cpp),Set(NUMERO_SALIDA=${TELVAL_E164MOV}) ; Simvoz: usa +549...
 ; same => n(cpp),Set(NUMERO_SALIDA=${TELVAL_CON0})    ; Claro: usa 0+10dig
 same => n,Dial(SIP/${NUMERO_SALIDA}@trunk_movil,60,gH)
 same => n,Goto(colgar)

 same => n(invalido),Verbose(1,TELVAL ERROR: ${TELVAL_ERROR})
 same => n,Playback(invalid-number)

 same => n(colgar),Hangup()


; ── Ejemplo: discador predictivo con múltiples trunks ─────────────────────────
[discador-salida]
exten => _X.,1,Macro(validar-numero,${EXTEN})
 same => n,GotoIf($["${TELVAL_VALID}" != "1"]?fin)

 ; Elegir trunk según operador (optimización de costos)
 same => n,GotoIf($["${TELVAL_OPERADOR}" = "Movistar"]?movistar)
 same => n,GotoIf($["${TELVAL_OPERADOR}" = "Claro"]?claro)
 same => n,GotoIf($["${TELVAL_OPERADOR}" = "Personal"]?personal)
 same => n,GotoIf($["${TELVAL_TIPO}" = "mobile"]?movil_generico)
 same => n,GotoIf($["${TELVAL_TIPO}" = "landline"]?fijo_generico)
 same => n,Goto(fin)

 same => n(movistar),Dial(SIP/${TELVAL_E164MOV}@trunk_movistar,60)
 same => n,Goto(fin)

 same => n(claro),Dial(SIP/${TELVAL_CON0}@trunk_claro,60)
 same => n,Goto(fin)

 same => n(personal),Dial(SIP/${TELVAL_CON015}@trunk_personal,60)
 same => n,Goto(fin)

 same => n(movil_generico),Dial(SIP/${TELVAL_E164MOV}@trunk_movil,60)
 same => n,Goto(fin)

 same => n(fijo_generico),Dial(SIP/${TELVAL_CON0}@trunk_fijo,60)

 same => n(fin),Hangup()
